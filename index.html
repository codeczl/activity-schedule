<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>活动行程表</title>
  <style>
    :root { color-scheme: light; font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; color: #17233b; background: #f4f6fa; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    main { width: min(1800px, calc(100% - 32px)); margin: 32px auto; }
    h1 { margin: 0 0 8px; font-size: 28px; font-weight: 700; letter-spacing: .02em; }
    .intro { margin: 0 0 24px; color: #65718a; font-size: 14px; }
    .lock-screen { position: fixed; z-index: 10; inset: 0; display: grid; place-items: center; padding: 20px; background: #f4f6fa; }
    .lock-card { width: min(360px, 100%); padding: 26px; background: #fff; border: 1px solid #e2e7f0; border-radius: 14px; box-shadow: 0 8px 28px #23395b12; }
    .lock-card h1 { margin: 0 0 8px; font-size: 22px; }
    .lock-card p { margin: 0 0 20px; color: #65718a; font-size: 14px; }
    .lock-card label { margin-bottom: 8px; }
    .lock-input { width: 100%; height: 44px; padding: 0 12px; border: 1px solid #d6ddea; border-radius: 8px; color: #17233b; font: inherit; letter-spacing: .2em; }
    .lock-input:focus { border-color: #5378dc; outline: none; box-shadow: 0 0 0 3px #5378dc1c; }
    .lock-submit { width: 100%; margin-top: 14px; }
    .lock-error { min-height: 20px; margin-top: 10px; color: #c33a46; font-size: 13px; }
    .entry, .list { background: #fff; border: 1px solid #e2e7f0; border-radius: 14px; box-shadow: 0 5px 18px #23395b0a; }
    .entry { padding: 20px; }
    label { display: block; margin-bottom: 9px; font-size: 14px; font-weight: 650; }
    textarea { display: block; width: 100%; min-height: 112px; resize: vertical; padding: 13px 14px; border: 1px solid #d6ddea; border-radius: 9px; outline: none; color: #17233b; font: inherit; line-height: 1.65; }
    textarea:focus { border-color: #5378dc; box-shadow: 0 0 0 3px #5378dc1c; }
    .entry-bottom { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; }
    .preview { min-height: 20px; color: #67738c; font-size: 13px; line-height: 1.6; }
    button { border: 0; border-radius: 8px; padding: 10px 18px; background: #315bd6; color: white; font: inherit; font-size: 14px; font-weight: 650; cursor: pointer; white-space: nowrap; }
    button:hover { background: #254bbd; }
    button:focus-visible, .remove:focus-visible { outline: 3px solid #93adff; outline-offset: 2px; }
    .list { margin-top: 18px; overflow: hidden; }
    .list-head { display: flex; align-items: baseline; justify-content: space-between; padding: 19px 20px 14px; }
    h2 { margin: 0; font-size: 17px; }
    .count { color: #7a859a; font-size: 13px; }
    .empty { padding: 36px 20px 40px; color: #8590a4; text-align: center; font-size: 14px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { position: relative; padding: 10px 16px; background: #f7f8fb; color: #737f95; font-size: 12px; font-weight: 600; }
    .col-resizer { position: absolute; z-index: 1; top: 0; right: -3px; width: 8px; height: 100%; cursor: col-resize; touch-action: none; user-select: none; }
    .col-resizer:hover, .col-resizer:active { background: #315bd633; }
    td { padding: 14px 16px; border-top: 1px solid #edf0f5; font-size: 14px; vertical-align: top; }
    td:first-child, th:first-child { padding-left: 20px; }
    .date { display: block; margin-bottom: 3px; color: #17233b; font-size: 14px; font-weight: 800; }
    .weekday { color: #53617a; white-space: nowrap; }
    .time { color: #2448a6; font-weight: 650; white-space: nowrap; }
    .upcoming-row td { background: #f5f8ff; box-shadow: inset 0 2px 8px #315bd610, inset 0 -2px 8px #315bd610; }
    .upcoming-row td:first-child { box-shadow: inset 4px 0 #315bd6, inset 0 2px 8px #315bd610, inset 0 -2px 8px #315bd610; }
    .today-tag { display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: 10px; background: #e5edff; color: #315bd6; font-size: 11px; font-weight: 650; vertical-align: 1px; }
    .place { min-width: 100px; line-height: 1.55; }
    .people { white-space: nowrap; }
    .inline-edit { width: 100%; min-width: 0; padding: 7px 8px; border: 1px solid transparent; border-radius: 6px; background: transparent; color: inherit; font: inherit; }
    .inline-edit:hover { border-color: #dce3f0; }
    .inline-edit:focus { border-color: #5378dc; outline: none; background: #fff; box-shadow: 0 0 0 2px #5378dc18; }
    .contact-cell { min-width: 90px; }
    .note-cell { min-width: 120px; }
    .note-edit { display: block; width: 100%; min-width: 0; min-height: 38px; padding: 7px 8px; border: 1px solid transparent; border-radius: 6px; background: transparent; color: inherit; font: inherit; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; resize: vertical; overflow: hidden; }
    .note-edit:hover { border-color: #dce3f0; }
    .note-edit:focus { border-color: #5378dc; outline: none; background: #fff; box-shadow: 0 0 0 2px #5378dc18; }
    .remove { padding: 3px 5px; background: transparent; color: #8a94a6; font-size: 13px; font-weight: 400; }
    .remove:hover { background: transparent; color: #c33a46; }
    @media (max-width: 560px) {
      main { margin: 26px auto; }
      h1 { font-size: 24px; }
      .entry { padding: 15px; }
      .entry-bottom { align-items: flex-end; }
      .preview { max-width: 65%; }
      th, td { padding-right: 12px; padding-left: 12px; }
    }
  </style>
</head>
<body>
  <section id="lockScreen" class="lock-screen" aria-label="进入密码">
    <form id="lockForm" class="lock-card">
      <h1>活动行程表</h1>
      <p>请输入密码后进入</p>
      <label for="entryPassword">进入密码</label>
      <input id="entryPassword" class="lock-input" type="password" inputmode="numeric" autocomplete="current-password" autofocus required>
      <button class="lock-submit" type="submit">进入</button>
      <div id="lockError" class="lock-error" role="alert" aria-live="polite"></div>
    </form>
  </section>
  <main id="appMain" hidden>
    <h1>活动行程表</h1>
    <p class="intro">粘贴活动文案，自动提取时间、地点和人数，并按时间排列。</p>

    <section class="entry" aria-label="添加活动">
      <label for="activityText">活动文案</label>
      <textarea id="activityText" placeholder="例如：\n华北电力大学（保定二校区）教11楼A座118\n100人\n15:00-16:00（提前15分钟到场）"></textarea>
      <div class="entry-bottom">
        <div id="preview" class="preview" aria-live="polite">识别后会显示在这里</div>
        <button id="addButton" type="button">加入行程</button>
      </div>
    </section>

    <section class="list" aria-label="行程列表">
      <div class="list-head"><h2>行程安排</h2><span id="count" class="count">0 项活动</span></div>
      <div id="schedule"></div>
    </section>
  </main>
  <script>
    const lockScreen = document.querySelector('#lockScreen');
    const appMain = document.querySelector('#appMain');
    const lockForm = document.querySelector('#lockForm');
    const entryPassword = document.querySelector('#entryPassword');
    const lockError = document.querySelector('#lockError');

    lockForm.addEventListener('submit', event => {
      event.preventDefault();
      if (entryPassword.value === '6668') {
        lockScreen.hidden = true;
        appMain.hidden = false;
      } else {
        lockError.textContent = '密码不正确，请重试';
        entryPassword.select();
      }
    });

    const STORAGE_KEY = 'simple-activity-schedule-v1';
    const input = document.querySelector('#activityText');
    const preview = document.querySelector('#preview');
    const schedule = document.querySelector('#schedule');
    const count = document.querySelector('#count');
    const COLUMN_WIDTHS_KEY = 'simple-activity-column-widths-v1';
    const COLUMNS = [
      { id: 'weekday', label: '周几', width: 78, min: 58 },
      { id: 'date', label: '日期', width: 118, min: 82 },
      { id: 'time', label: '时间', width: 138, min: 92 },
      { id: 'place', label: '地点', width: 250, min: 110 },
      { id: 'people', label: '人数', width: 105, min: 72 },
      { id: 'contact', label: '活动对接人', width: 155, min: 100 },
      { id: 'note', label: '备注', width: 280, min: 120 },
      { id: 'actions', label: '', width: 64, min: 48 }
    ];

    function parseActivityLegacy(raw) {
      const lines = raw.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
      const text = lines.join(' ');
      const rangeMatch = text.match(/(\d{1,2}[:：]\d{2})\s*[-—~～至到]\s*(\d{1,2}[:：]\d{2})/);
      const singleTimeMatch = text.match(/(上午|下午|晚上|中午|凌晨|早上)?\s*(\d{1,2})(?:[:：](\d{2})|点(半|\d{1,2}分?)?)/);
      const timeText = rangeMatch
        ? `${normalizeTime(rangeMatch[1])}–${normalizeTime(rangeMatch[2])}`
        : singleTimeMatch ? normalizeTimeMatch(singleTimeMatch) : '';
      const startText = rangeMatch ? normalizeTime(rangeMatch[1]) : singleTimeMatch ? normalizeTimeMatch(singleTimeMatch) : '';
      const peopleMatch = text.match(/(?:人数\s*[:：]?\s*)?(\d+)\s*(?:人|位)(?!次)/) || text.match(/人数\s*[:：]?\s*(\d+)/);
      const dateMatch = text.match(/(\d{4})[年./-](\d{1,2})[月./-](\d{1,2})日?/)
        || text.match(/(\d{1,2})月(\d{1,2})日?/)
        || text.match(/(\d{1,2})号/);
      const placeLines = lines.filter(line => !/(\d{1,2}[:：]\d{2})\s*[-—~～至到]\s*(\d{1,2}[:：]\d{2})/.test(line)
        && !/(上午|下午|晚上|中午|凌晨|早上)?\s*\d{1,2}(?:[:：]\d{2}|点(?:半|\d{1,2}分?)?)/.test(line)
        && !/(?:人数\s*[:：]?\s*)?\d+\s*(?:人|位)/.test(line)
        && !/^\d{4}[年./-]\d{1,2}[月./-]\d{1,2}日?$/.test(line)
        && !/^\d{1,2}月\d{1,2}日?$/.test(line)
        && !/^\d{1,2}号$/.test(line));
      let date = '';
      if (dateMatch) {
        const parts = dateMatch.length === 4
          ? [Number(dateMatch[1]), Number(dateMatch[2]), Number(dateMatch[3])]
          : dateMatch.length === 3
            ? [new Date().getFullYear(), Number(dateMatch[1]), Number(dateMatch[2])]
            : [new Date().getFullYear(), new Date().getMonth() + 1, Number(dateMatch[1])];
        date = `${parts[0]}-${String(parts[1]).padStart(2, '0')}-${String(parts[2]).padStart(2, '0')}`;
      }
      return {
        time: timeText,
        start: startText ? Number(startText.replace(':', '').padStart(4, '0')) : 9999,
        place: placeLines.join(' · '),
        people: peopleMatch ? `${peopleMatch[1]}人` : '',
        date,
        raw
      };
    }

    function parseActivity(raw) {
      const text = raw.replace(/\r/g, '').replace(/\n/g, ' ').trim();
      const rangeMatch = text.match(/(\d{1,2}[:：]\d{2})\s*[-—~～至到]\s*(\d{1,2}[:：]\d{2})/);
      const singleTimeMatch = text.match(/(上午|下午|晚上|中午|凌晨|早上)?\s*(\d{1,2}|[零〇一二两三四五六七八九十]{1,3})(?:[:：](\d{2})|点(半|\d{1,2}分?)?)/);
      const periodOnlyMatch = !rangeMatch && !singleTimeMatch ? text.match(/上午|下午|中午|晚上|凌晨|早上/) : null;
      const timeText = rangeMatch
        ? `${normalizeTime(rangeMatch[1])}–${normalizeTime(rangeMatch[2])}`
        : singleTimeMatch ? normalizeTimeMatch(singleTimeMatch) : periodOnlyMatch ? periodOnlyMatch[0] : '';
      const startText = rangeMatch ? normalizeTime(rangeMatch[1]) : singleTimeMatch ? normalizeTimeMatch(singleTimeMatch) : '';
      const peopleMatch = text.match(/(?:人数\s*[:：]?\s*)?(\d+)\s*(?:人|位)(?!次)/) || text.match(/人数\s*[:：]?\s*(\d+)/);
      const dateMatch = text.match(/(\d{4})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日?/)
        || text.match(/(\d{4})[./-](\d{1,2})[./-](\d{1,2})/)
        || text.match(/(\d{1,2})\s*月\s*(\d{1,2})\s*日?/)
        || text.match(/(\d{1,2})号/)
        || text.match(/(?:^|[\s,，])(0[1-9]|1[0-2])([0-3]\d)(?=$|[^\d])/);
      let date = '';
      if (dateMatch) {
        const parts = dateMatch.length === 4
          ? [Number(dateMatch[1]), Number(dateMatch[2]), Number(dateMatch[3])]
          : dateMatch.length === 3
            ? [new Date().getFullYear(), Number(dateMatch[1]), Number(dateMatch[2])]
            : [new Date().getFullYear(), new Date().getMonth() + 1, Number(dateMatch[1])];
        date = `${parts[0]}-${String(parts[1]).padStart(2, '0')}-${String(parts[2]).padStart(2, '0')}`;
      }
      const labeledPlaceMatch = text.match(/[【\[]参会地点[】\]]\s*([^；;\n]+)/);
      let place = labeledPlaceMatch ? labeledPlaceMatch[1] : text;
      if (!labeledPlaceMatch) {
        for (const match of [dateMatch, rangeMatch, rangeMatch ? null : singleTimeMatch, periodOnlyMatch, peopleMatch]) {
          if (match) place = place.replace(match[0], ' ');
        }
      }
      place = place.replace(/[（(](?:周[一二三四五六日天]|星期[一二三四五六日天])[)）]/g, ' ')
        .replace(/[，,；;、|]/g, ' ').replace(/\s+/g, ' ').trim();
      const periodOrder = { 凌晨: 300, 早上: 700, 上午: 900, 中午: 1200, 下午: 1300, 晚上: 1800 };
      const start = startText ? Number(startText.replace(':', '').padStart(4, '0')) : periodOnlyMatch ? periodOrder[periodOnlyMatch[0]] : 9999;
      return { time: timeText, start, place, people: peopleMatch ? `${peopleMatch[1]}人` : '', date, raw };
    }

    function splitActivities(raw) {
      return raw.split(/\r?\n\s*\r?\n+/).map(block => block.trim()).filter(Boolean);
    }

    function normalizeTime(value) {
      const match = String(value).match(/(\d{1,2})[:：](\d{2})/);
      return match ? `${String(Number(match[1])).padStart(2, '0')}:${match[2]}` : String(value);
    }

    function normalizeTimeMatch(match) {
      let hour = parseChineseNumber(match[2]);
      const minute = match[3] ? Number(match[3]) : match[4] === '半' ? 30 : match[4] ? Number(match[4].replace('分', '')) : 0;
      if ((match[1] === '下午' || match[1] === '晚上') && hour < 12) hour += 12;
      if ((match[1] === '上午' || match[1] === '凌晨' || match[1] === '早上') && hour === 12) hour = 0;
      return `${String(hour).padStart(2, '0')}:${String(minute).padStart(2, '0')}`;
    }

    function parseChineseNumber(value) {
      if (/^\d+$/.test(value)) return Number(value);
      const digits = { 零: 0, 〇: 0, 一: 1, 二: 2, 两: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9 };
      if (value === '十') return 10;
      if (value.includes('十')) {
        const [tens, ones] = value.split('十');
        return (tens ? digits[tens] : 1) * 10 + (ones ? digits[ones] : 0);
      }
      return digits[value] ?? 0;
    }

    function getActivities() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
      catch { return []; }
    }

    function render() {
      const today = localDateKey();
      const now = new Date();
      const currentTime = now.getHours() * 100 + now.getMinutes();
      const items = getSortedActivities();
      count.textContent = `${items.length} 项活动`;
      if (!items.length) {
        schedule.innerHTML = '<div class="empty">还没有活动，粘贴一条文案即可生成行程。</div>';
        return;
      }
      const rows = items.map((item, index) => {
        const isToday = item.date === today;
        const isUpcoming = isToday && item.start < 2400 && item.start > currentTime;
        return `<tr class="${isUpcoming ? 'upcoming-row' : ''}" data-index="${index}" data-date="${escapeHtml(item.date || '')}" data-start="${item.start}">
        <td class="weekday">${item.date ? escapeHtml(formatWeekday(item.date)) : '—'}</td>
        <td><span class="date">${item.date ? escapeHtml(formatDate(item.date)) : '日期未注明'}${item.date === today ? '<span class="today-tag">今天</span>' : ''}</span></td>
        <td><span class="time">${escapeHtml(item.time || '时间未识别')}</span></td>
        <td class="place"><input class="inline-edit" type="text" data-index="${index}" data-field="place" value="${escapeHtml(item.place || '')}" placeholder="填写地点" aria-label="编辑地点"></td>
        <td class="people"><input class="inline-edit" type="text" data-index="${index}" data-field="people" value="${escapeHtml(item.people || '')}" placeholder="填写人数" aria-label="编辑人数"></td>
        <td class="contact-cell"><input class="inline-edit" type="text" data-index="${index}" data-field="contact" value="${escapeHtml(item.contact || '')}" placeholder="填写对接人" aria-label="编辑活动对接人"></td>
        <td class="note-cell"><textarea class="note-edit" data-index="${index}" data-field="note" placeholder="填写备注" aria-label="编辑备注">${escapeHtml(item.note || '')}</textarea></td>
        <td><button class="remove" type="button" data-index="${index}" aria-label="删除活动">删除</button></td>
      </tr>`;
      }).join('');
      const widths = getColumnWidths();
      const colgroup = `<colgroup>${COLUMNS.map(column => `<col data-col="${column.id}" style="width:${widths[column.id] || column.width}px">`).join('')}</colgroup>`;
      const headers = `<thead><tr>${COLUMNS.map(column => `<th>${column.label}<span class="col-resizer" data-col="${column.id}" role="separator" aria-orientation="vertical" aria-label="拖动调整${column.label || '操作'}列宽"></span></th>`).join('')}</tr></thead>`;
      schedule.innerHTML = `<div class="table-wrap"><table style="width:max-content;min-width:100%;table-layout:fixed">${colgroup}${headers}<tbody>${rows}</tbody></table></div>`;
      updateTimeHighlights();
      attachColumnResizers();
      schedule.querySelectorAll('.note-edit').forEach(autoResizeNote);
      schedule.querySelectorAll('.inline-edit').forEach(input => input.addEventListener('input', () => {
        const current = getSortedActivities();
        const item = current[Number(input.dataset.index)];
        if (!item) return;
        item[input.dataset.field] = input.value;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(current));
      }));
      schedule.querySelectorAll('.note-edit').forEach(input => input.addEventListener('input', () => {
        autoResizeNote(input);
        const current = getSortedActivities();
        const item = current[Number(input.dataset.index)];
        if (!item) return;
        item.note = input.value;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(current));
      }));
      schedule.querySelectorAll('.remove').forEach(button => button.addEventListener('click', () => {
        const current = getSortedActivities();
        current.splice(Number(button.dataset.index), 1);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(current));
        render();
      }));
    }

    function getSortedActivities() {
      return getActivities().sort((a, b) => (a.date || '').localeCompare(b.date || '') || a.start - b.start);
    }

    function getColumnWidths() {
      try { return JSON.parse(localStorage.getItem(COLUMN_WIDTHS_KEY) || '{}'); }
      catch { return {}; }
    }

    function attachColumnResizers() {
      schedule.querySelectorAll('.col-resizer').forEach(handle => handle.addEventListener('pointerdown', event => {
        event.preventDefault();
        const column = COLUMNS.find(item => item.id === handle.dataset.col);
        const col = schedule.querySelector(`col[data-col="${column.id}"]`);
        const startX = event.clientX;
        const startWidth = col.getBoundingClientRect().width;
        const move = moveEvent => {
          const width = Math.max(column.min, startWidth + moveEvent.clientX - startX);
          col.style.width = `${width}px`;
        };
        const finish = () => {
          document.removeEventListener('pointermove', move);
          document.removeEventListener('pointerup', finish);
          document.removeEventListener('pointercancel', finish);
          const widths = getColumnWidths();
          widths[column.id] = Math.round(col.getBoundingClientRect().width);
          localStorage.setItem(COLUMN_WIDTHS_KEY, JSON.stringify(widths));
        };
        document.addEventListener('pointermove', move);
        document.addEventListener('pointerup', finish, { once: true });
        document.addEventListener('pointercancel', finish, { once: true });
      }));
    }

    function repairSavedDates() {
      let changed = false;
      const items = getActivities().map(item => {
        if (item.date || !item.raw) return item;
        const parsed = parseActivity(item.raw);
        if (!parsed.date) return item;
        changed = true;
        return { ...item, date: parsed.date, start: parsed.start, time: parsed.time || item.time, place: parsed.place || item.place, people: item.people || parsed.people };
      });
      if (changed) localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    }

    function updateTimeHighlights() {
      const today = localDateKey();
      const now = new Date();
      const currentTime = now.getHours() * 100 + now.getMinutes();
      schedule.querySelectorAll('tr[data-date]').forEach(row => {
        const start = Number(row.dataset.start);
        row.classList.toggle('upcoming-row', row.dataset.date === today && start < 2400 && start > currentTime);
      });
    }

    function scrollToNextActivity() {
      const today = localDateKey();
      const now = new Date();
      const currentTime = now.getHours() * 100 + now.getMinutes();
      const items = getSortedActivities();
      const index = items.findIndex(item => item.date && (item.date > today || (item.date === today && item.start < 2400 && item.start > currentTime)));
      if (index < 0) return;
      const row = schedule.querySelector(`tr[data-index="${index}"]`);
      if (!row) return;
      const top = window.scrollY + row.getBoundingClientRect().top - 16;
      window.scrollTo(0, Math.max(0, top));
    }

    function autoResizeNote(textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = `${Math.max(textarea.scrollHeight, 38)}px`;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    }

    function formatDate(value) {
      const match = String(value).match(/^\d{4}-(\d{2})-(\d{2})$/);
      if (!match) return value;
      const year = Number(value.slice(0, 4));
      const month = Number(match[1]);
      const day = Number(match[2]);
      return `${month}月${day}日`;
    }

    function formatWeekday(value) {
      const match = String(value).match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!match) return '';
      const weekday = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3])).getDay()];
      return weekday;
    }

    function localDateKey() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    }

    input.addEventListener('input', () => {
      const value = input.value.trim();
      if (!value) { preview.textContent = '识别后会显示在这里'; return; }
      const items = splitActivities(value).map(parseActivity);
      preview.textContent = items.length > 1
        ? `识别到 ${items.length} 项活动：${items.map(item => `${item.date ? formatDate(item.date) + ' ' : ''}${item.time || '未识别时间'}`).join('、')}`
        : [items[0].date ? formatDate(items[0].date) : '未识别日期', items[0].time || '未识别时间', items[0].place || '未识别地点', items[0].people || '未识别人数'].join(' · ');
    });

    document.querySelector('#addButton').addEventListener('click', () => {
      const raw = input.value.trim();
      if (!raw) { input.focus(); return; }
      const items = getActivities();
      items.push(...splitActivities(raw).map(parseActivity));
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      input.value = '';
      preview.textContent = '识别后会显示在这里';
      render();
      input.focus();
    });

    repairSavedDates();
    render();
    requestAnimationFrame(scrollToNextActivity);
    setInterval(updateTimeHighlights, 30000);
  </script>
</body>
</html>
